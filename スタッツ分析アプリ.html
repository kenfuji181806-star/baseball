  ・ブラウザで開くだけで使えます（Excel読込ライブラリとフォントのためインターネット接続が必要）

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14212B">
<title>野球スタッツ分析</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#14212B; --ink2:#5A6A73; --line:#DCE3E1; --chip:#E9EEEC;
  --accent:#E0A100; --accent-ink:#7A5600; --accent-soft:rgba(224,161,0,.16);
  --good:#1F7A4D; --bad:#C2412D; --head:#14212B; --head-ink:#F3F6F5;
  --num:"Barlow Condensed","BIZ UDPGothic",sans-serif;
  --txt:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E171C; --surface:#152229; --ink:#E6EDF0; --ink2:#93A4AD; --line:#26363F; --chip:#1D2C35;
    --accent:#F2B92B; --accent-ink:#F2B92B; --accent-soft:rgba(242,185,43,.18);
    --good:#4CC38A; --bad:#F0795F; --head:#0A1216; --head-ink:#E6EDF0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#152229; --ink:#E6EDF0; --ink2:#93A4AD; --line:#26363F; --chip:#1D2C35;
  --accent:#F2B92B; --accent-ink:#F2B92B; --accent-soft:rgba(242,185,43,.18);
  --good:#4CC38A; --bad:#F0795F; --head:#0A1216; --head-ink:#E6EDF0; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:15px;line-height:1.6;padding-bottom:84px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* ヘッダー（検索） */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);padding:10px 14px 12px}
.top-in{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;opacity:.75;margin-bottom:6px}
.search{position:relative}
.search input{width:100%;border:0;border-radius:10px;padding:11px 14px 11px 38px;font:inherit;font-size:16px;background:rgba(255,255,255,.12);color:var(--head-ink)}
.search input::placeholder{color:rgba(243,246,245,.6)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border-radius:12px;border:1px solid var(--line);max-height:60vh;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.results .grp{font-size:.75rem;color:var(--ink2);padding:10px 14px 4px}

.app{max-width:720px;margin:0 auto;padding:4px 14px 24px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ink2);padding:12px 0 4px;cursor:pointer;font-size:.9rem}
h1.name{font-size:1.7rem;line-height:1.25;margin:4px 0 2px;font-weight:700;letter-spacing:.01em}
.meta{color:var(--ink2);font-size:.88rem}
h2.sec{font-size:1rem;margin:26px 0 10px;font-weight:700}
.note{color:var(--ink2);font-size:.8rem;margin:6px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--ink2);text-align:center;margin:12px 0}

/* スコアボード風の数字（このアプリの主役） */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--head);color:var(--head-ink);border-radius:14px;padding:14px 6px 12px;margin:14px 0 8px}
.board .c{text-align:center;padding:0 4px;border-left:1px solid rgba(255,255,255,.12)}
.board .c:first-child{border-left:0}
.board .v{font-family:var(--num);font-weight:600;font-size:2.35rem;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.board.long .v{font-size:clamp(1.5rem,7.4vw,2.2rem)}
.board .l{font-size:.72rem;opacity:.7;margin-top:6px}
.board .d{font-family:var(--num);font-size:.85rem;margin-top:2px}
.board .d.up{color:#7EE2AE} .board .d.down{color:#FF9B85}
.board.lit .c.key .v{color:var(--accent)}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.minis div{background:var(--surface);padding:8px 10px}
.minis b{display:block;font-family:var(--num);font-weight:600;font-size:1.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.minis span{font-size:.72rem;color:var(--ink2)}
.minis i{font-style:normal;font-size:.7rem;color:var(--accent-ink);margin-left:6px;font-weight:700}
.minis span{display:inline-block;line-height:1.3}

/* セグメント・チップ */
.seg{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:10px;margin:16px 0 4px;overflow-x:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,92px));z-index:10}
.seg button{flex:1 0 auto;border:0;background:none;padding:8px 12px;border-radius:8px;font-size:.9rem;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fld{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
label.lbl{display:block;font-size:.8rem;color:var(--ink2);margin:10px 0 4px}

/* リスト */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--chip)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--ink2);font-size:.8rem}
.row .r{text-align:right;flex-shrink:0}
.row .big{font-family:var(--num);font-weight:600;font-size:1.55rem;line-height:1;font-variant-numeric:tabular-nums}
.row .small{font-size:.72rem;color:var(--ink2)}
.row .rank{font-family:var(--num);font-weight:700;font-size:1.15rem;width:1.6em;color:var(--ink2);text-align:center;flex-shrink:0}
.row .chev{color:var(--ink2);flex-shrink:0}
.badge{display:inline-block;font-size:.72rem;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;background:var(--chip);color:var(--ink2);font-weight:400}
.badge.w{background:rgba(31,122,77,.14);color:var(--good)} .badge.l{background:rgba(194,65,45,.14);color:var(--bad)}

/* 表（1列目固定） */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
tr:last-child td{border-bottom:0}
th{font-weight:400;color:var(--ink2);font-size:.75rem;cursor:pointer;background:var(--surface)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;box-shadow:1px 0 0 var(--line)}
td.num{font-family:var(--num);font-size:1rem}

/* 横棒・100%棒 */
.bars{display:grid;gap:8px;margin:8px 0}
.bar{display:grid;grid-template-columns:minmax(64px,30%) 1fr auto;align-items:center;gap:8px;font-size:.84rem}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{height:14px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar .fil{height:100%;background:var(--ink);border-radius:4px}
.bar.hi .fil{background:var(--accent)}
.bar .val{font-family:var(--num);font-weight:600;font-size:1.05rem;min-width:3.2em;text-align:right}
.stack{display:grid;grid-template-columns:3.2em 1fr 2.6em;align-items:center;gap:8px;font-size:.8rem;margin:5px 0}
.stack .sb{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--chip)}
.stack .sb i{display:block;height:100%}
.stack .n{color:var(--ink2);text-align:right;font-family:var(--num)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--ink2);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
.svgbox svg{display:block;width:100%;height:auto}
.svgbox text{font-family:var(--num);font-weight:600}
.svgbox text.j{font-family:var(--txt);font-weight:400}
.tip{min-height:1.4em;font-size:.8rem;color:var(--ink2);padding:2px 4px}

/* フィルター */
.fbar{display:flex;align-items:center;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:.88rem}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn .cnt{display:inline-block;background:var(--accent);color:#14212B;border-radius:999px;font-size:.72rem;padding:0 6px;margin-left:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:18px 18px 0 0;max-height:85vh;overflow-y:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:1.05rem}
.sheet .foot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);display:flex;gap:8px;padding:12px 0 4px;margin-top:12px;border-top:1px solid var(--line)}
.sheet .foot .btn{flex:1}

/* 下部ナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--ink2);cursor:pointer}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on svg{color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.err{background:rgba(194,65,45,.1);color:var(--bad);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.88rem}
.help p{margin:0 0 10px;font-size:.86rem}
.help code{background:var(--chip);border-radius:4px;padding:0 4px}
@media (min-width:760px){
  .board .v{font-size:2.8rem}
  h1.name{font-size:2rem}
}
</style>
</head>

function batM(o){
  const x = Object.assign({}, o);
  x["1B"] = x.H - x["2B"] - x["3B"] - x.HR; x.TB = x["1B"] + 2*x["2B"] + 3*x["3B"] + 4*x.HR;
  x.AVG = sd(x.H, x.AB); x.OBP = sd(x.H + x.BB + x.HBP, x.AB + x.BB + x.HBP + x.SF);

}
function pitM(o){
  const x = Object.assign({}, o), ip = x.outs / 3;

  x.FIP = sd(13*x.HR + 3*(x.BB + x.HBP) - 2*x.SO, ip) + S.fip;
  x["K%"] = sd(x.SO, x.BF); x["BB%"] = sd(x.BB, x.BF); x.OAVG = sd(x.H, x.BF - x.BB - x.HBP); return x;

function aggBat(rows, fn){ return [...groupBy(rows, fn)].map(([k, rs]) => { const o = sumRows(rs, BAT); o.G = uniq(rs.map(r => r.game_id)).length; o.team = rs[0].team; o.player = rs[0].player; o.key = k; return batM(o); }); }

  let gl = null;
  if(d.games && d.games.length) gl = d.games.map(g => Object.assign({}, g));
  else if(d.bat && d.bat.length){
    const rf = [...groupBy(d.bat, r => r.team + "|" + r.game_id)].map(([k, rs]) => ({team: rs[0].team, game_id: rs[0].game_id, date: rs[0].date, opponent: rs[0].opponent, runs_for: rs.reduce((a, r) => a + r.R, 0)}));
    if(d.pit && d.pit.length){
      const ra = new Map([...groupBy(d.pit, r => r.team + "|" + r.game_id)].map(([k, rs]) => [k, rs.reduce((a, r) => a + r.R, 0)]));
      gl = rf.filter(r => ra.has(r.team + "|" + r.game_id)).map(r => Object.assign(r, {runs_against: ra.get(r.team + "|" + r.game_id)}));
    } else {
      const m = new Map(rf.map(r => [r.team + "|" + r.game_id, r.runs_for]));
      gl = rf.filter(r => m.has(r.opponent + "|" + r.game_id)).map(r => Object.assign(r, {runs_against: m.get(r.opponent + "|" + r.game_id)}));

  return [...groupBy(gl, r => r.team)].map(([t, rs]) => {

    const RS = rs.reduce((a, r) => a + r.runs_for, 0), RA = rs.reduce((a, r) => a + r.runs_against, 0), G = rs.length;
    const p = Math.pow(RS, 1.83), q = Math.pow(RA, 1.83);
    return {team: t, G, W, L, T, RS, RA, WPCT: sd(W, W + L), DIFF: RS - RA, "RS/G": sd(RS, G), "RA/G": sd(RA, G), PYTH: sd(p, p + q)};
  });
}

function fmt(col, v){
  if(v == null || (typeof v === "number" && isNaN(v))) return "—";
  if(typeof v !== "number") return String(v);
  if(RATE3.has(col)){ const s = v.toFixed(3); return (v >= 0 && v < 1) ? s.replace("0.", ".") : s; }
  if(RATE2.has(col)) return v.toFixed(2);
  if(PCT.has(col)) return (v*100).toFixed(1) + "%";
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
function fmtCell(col, v){
  if(v == null || (typeof v === "number" && isNaN(v))) return "";
  if(typeof v !== "number") return String(v);
  if(RATE3.has(col)) return v.toFixed(3);
  if(RATE2.has(col)) return v.toFixed(2);
  if(PCT.has(col)) return (v*100).toFixed(1) + "%";
  if(col.endsWith("(%)") || col === "平均球速") return v.toFixed(1);
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k === "style") e.style.cssText = v;
    else if(v === true) e.setAttribute(k, "");
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}

const KIND_LABELS = {batting: "打撃成績", pitching: "投手成績", games: "試合結果", pitches: "一球・打席データ"};
const EXCLUDE = new Set(["合計","計","チーム計","チーム合計","total","totals"]);
const norm = s => String(s ?? "").normalize("NFKC").trim().toLowerCase().replace(/[\s_]/g, "");
const ALIAS_N = {};
for(const [k, m] of Object.entries(ALIASES)){ ALIAS_N[k] = {}; for(const [c, al] of Object.entries(m)) ALIAS_N[k][c] = [norm(c), ...al.map(norm)]; }

function detectKind(header){
  const s = new Set(header.map(norm));
  const has = (k, key) => ALIAS_N[k][key].some(a => s.has(a));
  if(has("pitches","pitcher") && has("pitches","batter") && ["pitch_type","balls","pa_result","pitch_result"].some(k => has("pitches", k))) return "pitches";
  if(has("pitching","player") && has("pitching","IP")) return "pitching";
  if(has("batting","player") && (has("batting","AB") || has("batting","PA"))) return "batting";
  if(["team","opponent","runs_for","runs_against"].every(k => has("games", k)) || ["home","away","home_score","away_score"].every(k => has("games", k))) return "games";
  return null;
}
function mapHeader(header, kind){
  const nh = header.map(norm), map = new Array(header.length).fill(null);
  for(const [canon, als] of Object.entries(ALIAS_N[kind])){
    for(const a of als){ const i = nh.findIndex((h, j) => h === a && map[j] == null); if(i >= 0){ map[i] = canon; break; } }
  }
  return map;
}
const blank = v => v == null || (typeof v === "string" && v.trim() === "");
function locateTable(aoa){
  const rows = aoa.filter(r => Array.isArray(r) && r.some(v => !blank(v)));
  for(let i = 0; i < Math.min(15, rows.length); i++){
    const header = rows[i].map(v => blank(v) ? "" : String(v).trim());
    const kind = detectKind(header);
    if(kind){
      const map = mapHeader(header, kind);
      const objs = rows.slice(i + 1).map(r => { const o = {}; map.forEach((c, j) => { if(c) o[c] = r[j]; }); return o; });
      return {kind, objs, cols: new Set(map.filter(Boolean))};
    }
  }
  return null;
}

// ---- 値の変換 ----
const pad = n => String(n).padStart(2, "0");
function num(v){
  if(v == null) return NaN;
  if(typeof v === "number") return v;
  if(typeof v === "boolean") return v ? 1 : 0;
  const s = String(v).normalize("NFKC").replace(/,/g, "").trim();
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s) ? parseFloat(s) : NaN;
}
const num0 = v => { const n = num(v); return isNaN(n) ? 0 : n; };
function str(v, def){
  if(v == null) return def;
  const s = String(v).normalize("NFKC").trim();
  return (s === "" || s.toLowerCase() === "nan" || s.toLowerCase() === "null") ? def : s;
}
function parseDate(v){
  if(blank(v)) return "";
  if(typeof v === "number"){ if(v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10); return ""; }
  if(v instanceof Date) return isNaN(v) ? "" : `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  const s = String(v).normalize("NFKC").trim();
  let m = /^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/.exec(s); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = /^(\d{4})(\d{2})(\d{2})$/.exec(s); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  if(/^\d{5}(\.\d+)?$/.test(s)) return parseDate(parseFloat(s));
  return "";
}
function parseIP(v){
  if(blank(v)) return 0;
  if(typeof v === "number"){
    const w = Math.floor(v + 1e-9), f = Math.round((v - w) * 10);
    return (f >= 0 && f <= 2) ? w * 3 + f : Math.round(v * 3);
  }
  const s = String(v).normalize("NFKC").replace(/回/g, " ").trim();
  const m = /^(\d+)?\s*(?:(\d)\s*\/\s*3)?$/.exec(s);
  if(m && (m[1] || m[2])) return (+(m[1] || 0)) * 3 + (+(m[2] || 0));
  const n = num(s); return isNaN(n) ? 0 : parseIP(n);
}
const PA_JP = [["HR",["本塁打","ホームラン"]],["3B",["三塁打","スリーベース"]],["2B",["二塁打","ツーベース"]],["SF",["犠飛","犠牲フライ"]],
  ["SH",["犠打","犠牲バント"]],["HBP",["死球"]],["BB",["四球","敬遠"]],["SO",["三振","振り逃げ"]],["1B",["単打","安打","ヒット"]]];
const PA_EN = {hr:"HR",home_run:"HR",homerun:"HR","3b":"3B",triple:"3B","2b":"2B",double:"2B",sf:"SF",sac_fly:"SF",sh:"SH",sac_bunt:"SH",
  hbp:"HBP",hit_by_pitch:"HBP",bb:"BB",walk:"BB",ibb:"BB",intent_walk:"BB",so:"SO",k:"SO",strikeout:"SO",strikeout_double_play:"SO","1b":"1B",single:"1B"};
function classifyPA(v){
  const s = str(v, null); if(s == null) return null;
  if(PA_EN[s.toLowerCase()]) return PA_EN[s.toLowerCase()];
  for(const [e, ws] of PA_JP) if(ws.some(w => s.includes(w))) return e;
  return "OUT";
}
const PR_EN = {ball:"ボール",blocked_ball:"ボール",called_strike:"見逃し",swinging_strike:"空振り",swinging_strike_blocked:"空振り",foul_tip:"空振り",
  foul:"ファウル",foul_bunt:"ファウル",hit_into_play:"インプレー",hit_by_pitch:"死球"};
function classifyPitch(v){
  const s = str(v, null); if(s == null) return null;
  if(PR_EN[s.toLowerCase()]) return PR_EN[s.toLowerCase()];
  for(const [k, ws] of [["空振り",["空振"]],["見逃し",["見逃"]],["ファウル",["ファウル","ファール"]],["死球",["死球"]],["インプレー",["インプレ","打球","打撃"]],["ボール",["ボール"]],["見逃し",["ストライク"]]])
    if(ws.some(w => s.includes(w))) return k;
  return s;
}
function hand(v){
  const s = str(v, null); if(s == null) return null; const u = s.toUpperCase();
  if(u.startsWith("右") || u.startsWith("R")) return "右";
  if(u.startsWith("左") || u.startsWith("L")) return "左";
  if(u.startsWith("両") || u.startsWith("S") || u.startsWith("B") || u.startsWith("スイッチ")) return "両";
  return s;
}
function isRisp(v){
  const s = str(v, ""); if(/^[01]{3}$/.test(s)) return s[1] === "1" || s[2] === "1";
  return /[二三満]/.test(s);
}

// ---- 種類別の前処理 ----
function common(o, hasGid){
  const team = str(o.team, "チーム未設定"), opponent = str(o.opponent, "不明"), date = parseDate(o.date);
  const game_id = hasGid ? str(o.game_id, "試合不明") : `${date || "日付不明"}_${[team, opponent].sort().join("-")}`;
  return {team, opponent, date, game_id};
}
function prepBatting(objs, cols){
  const hasGid = objs.some(o => !blank(o.game_id));
  const rows = objs.map(o => {
    const r = Object.assign(common(o, hasGid), {player: str(o.player, "")});
    BAT.forEach(c => r[c] = num0(o[c]));
    if(!cols.has("PA")) r.PA = r.AB + r.BB + r.HBP + r.SH + r.SF;
    if(!cols.has("AB")) r.AB = Math.max(0, r.PA - r.BB - r.HBP - r.SH - r.SF);
    return r;
  }).filter(r => r.player && !EXCLUDE.has(r.player.toLowerCase()));
  return {rows, missing: BAT.filter(c => !cols.has(c))};
}
function prepPitching(objs, cols){
  const hasGid = objs.some(o => !blank(o.game_id));
  const rows = objs.map(o => {
    const r = Object.assign(common(o, hasGid), {player: str(o.player, "")});
    PIT.forEach(c => r[c] = c === "outs" ? parseIP(o.IP) : num0(o[c]));
    if(cols.has("R") && !cols.has("ER")) r.ER = r.R;
    if(cols.has("ER") && !cols.has("R")) r.R = r.ER;
    return r;
  }).filter(r => r.player && !EXCLUDE.has(r.player.toLowerCase()));
  return {rows, missing: PIT.filter(c => c !== "outs" && !cols.has(c))};
}
function prepGames(objs, cols){
  let list = objs;
  if(cols.has("home") && cols.has("away") && !(cols.has("runs_for") && cols.has("runs_against"))){
    list = [];
    objs.forEach(o => {
      list.push({date: o.date, game_id: o.game_id, team: o.home, opponent: o.away, runs_for: o.home_score, runs_against: o.away_score});
      list.push({date: o.date, game_id: o.game_id, team: o.away, opponent: o.home, runs_for: o.away_score, runs_against: o.home_score});
    });
  }
  const hasGid = list.some(o => !blank(o.game_id)), seen = new Set(), rows = [];
  list.forEach(o => {
    const r = Object.assign(common(o, hasGid), {runs_for: num(o.runs_for), runs_against: num(o.runs_against)});
    const k = r.team + "|" + r.game_id;
    if(isNaN(r.runs_for) || isNaN(r.runs_against) || seen.has(k) || blank(o.team)) return;
    seen.add(k); rows.push(r);
  });
  return {rows, missing: []};
}
function teamOf(rows){
  const m = new Map();
  (rows || []).forEach(r => { const c = m.get(r.player) || {}; c[r.team] = (c[r.team] || 0) + 1; m.set(r.player, c); });
  const out = new Map(); m.forEach((c, p) => out.set(p, Object.entries(c).sort((a, b) => b[1] - a[1])[0][0])); return out;
}
function prepPitches(objs, cols, bat, pit){
  const bt = teamOf(bat), pt = teamOf(pit);
  const hasGid = objs.some(o => !blank(o.game_id));
  const rows = objs.map(o => {
    const r = {date: parseDate(o.date), pitcher: str(o.pitcher, "不明"), batter: str(o.batter, "不明")};
    r.game_id = hasGid ? str(o.game_id, "試合不明") : r.date;
    r.batter_team = cols.has("batter_team") ? str(o.batter_team, "不明") : (bt.get(r.batter) || "不明");
    r.pitcher_team = cols.has("pitcher_team") ? str(o.pitcher_team, "不明") : (pt.get(r.pitcher) || "不明");
    ["inning","outs","speed","loc_x","loc_z","hit_x","hit_y"].forEach(c => { if(cols.has(c)){ const n = num(o[c]); r[c] = isNaN(n) ? null : n; } });
    ["half","runners","pitch_type","zone","bb_type","bb_dir","pa_result"].forEach(c => { if(cols.has(c)) r[c] = str(o[c], null); });
    if(cols.has("p_throws")) r.p_throws = hand(o.p_throws);
    if(cols.has("b_stands")) r.b_stands = hand(o.b_stands);
    if(cols.has("balls") && cols.has("strikes")){
      const b = num(o.balls), s = num(o.strikes);
      if(isNaN(b) || isNaN(s)){ r.count = "不明"; r.count_state = "不明"; }
      else { r.count = `${b}-${s}`; r.count_state = s === 2 ? "2ストライク" : b > s ? "打者有利（ボール先行）" : s > b ? "投手有利（ストライク先行）" : "平行カウント"; }
    }
    if(cols.has("pa_result")) r.pa_event = classifyPA(o.pa_result);
    if(cols.has("pitch_result")) r.pitch_cat = classifyPitch(o.pitch_result);
    if(cols.has("runners")) r.risp = isRisp(o.runners) ? "得点圏" : "得点圏以外";
    return r;
  });
  return {rows, missing: []};
}
function buildDataset(sources){
  const buckets = {batting: [], pitching: [], games: [], pitches: []}, cols = {batting: new Set(), pitching: new Set(), games: new Set(), pitches: new Set()}, log = [];
  const recList = [], roster = [], recWarn = [];
  sources.forEach(({label, aoa}) => {
    const rr = recRows(aoa);
    if(rr){ recList.push({src: label, objs: rr}); log.push({"ファイル / シート": label, "判定結果": "投球記録（記録アプリ）" + (rr.sections > 1 ? `・見出し${rr.sections}か所` : ""), "行数": rr.length}); if(rr.layouts > 1) recWarn.push(`${label}：列の並びが違う記録が貼り合わされていました（Excel形式とCSV形式など）。見出し行ごとに列を読み分けています。`); return; }
    const ro = rosterRows(aoa);
    if(ro){ roster.push(...ro); log.push({"ファイル / シート": label, "判定結果": "選手マスタ", "行数": ro.length}); return; }
    const t = locateTable(aoa);
    log.push({"ファイル / シート": label, "判定結果": t ? KIND_LABELS[t.kind] : "未判定（読み込み対象外）", "行数": t ? t.objs.length : 0});
    if(t){ buckets[t.kind].push(...t.objs); t.cols.forEach(c => cols[t.kind].add(c)); }
  });
  const ds = {log, missing: {}, bat: null, pit: null, games: null, pitches: null};
  if(buckets.batting.length){ const r = prepBatting(buckets.batting, cols.batting); ds.bat = r.rows; ds.missing.batting = r.missing; }
  if(buckets.pitching.length){ const r = prepPitching(buckets.pitching, cols.pitching); ds.pit = r.rows; ds.missing.pitching = r.missing; }
  if(buckets.games.length){ const r = prepGames(buckets.games, cols.games); ds.games = r.rows; }
  if(buckets.pitches.length){ ds.pitches = prepPitches(buckets.pitches, cols.pitches, ds.bat, ds.pit).rows; }
  ds.unavail = new Set(); ds.recorder = false; ds.nGames = 0;
  if(recList.length){
    const cv = convertRecorder(recList);
    ds.recorder = true; ds.nGames = cv.nGames; ds.warnings = recWarn.concat(cv.warnings || []);
    if(!ds.bat) ["R","SB","CS"].forEach(c => ds.unavail.add(c));
    ["bat","pit","games","pitches"].forEach(k => { ds[k] = (ds[k] || []).concat(cv[k]); });
  }
  ds.roster = new Map();
  roster.forEach(r => ds.roster.set(r.team + "|" + r.player, r));
  ["bat","pit","games","pitches"].forEach(k => { if(ds[k] && !ds[k].length) ds[k] = null; });
  return ds;
}

// ---- ファイル読み込み ----
function parseCSV(text){
  const first = text.split(/\r?\n/, 1)[0] || "", sep = (first.split("\t").length > first.split(",").length) ? "\t" : ",";
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(f); f = ""; }
    else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function decodeText(buf){
  try { return new TextDecoder("utf-8", {fatal: true}).decode(buf).replace(/^\uFEFF/, ""); }
  catch(e){ return new TextDecoder("shift_jis").decode(buf); }
}
async function readFiles(files){
  const sources = [], errors = [];
  for(const file of files){
    try {
      const buf = await file.arrayBuffer(), name = file.name;
      if(/\.(csv|tsv|txt)$/i.test(name)) sources.push({label: name, aoa: parseCSV(decodeText(buf))});
      else if(/\.(xlsx|xlsm|xls)$/i.test(name)){
        if(!window.XLSX) throw new Error("Excel読み込みライブラリを読み込めませんでした（インターネット接続を確認してください）");
        const wb = XLSX.read(new Uint8Array(buf), {type: "array"});
        wb.SheetNames.forEach(sn => sources.push({label: `${name} / ${sn}`, aoa: XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, raw: true, defval: null, blankrows: false})}));
      } else errors.push(`${name}: 対応していない形式です（.xlsx / .csv に対応）`);
    } catch(e){ errors.push(`${file.name}: ${e.message}`); }
  }
  return {sources, errors};
}

  "打球性質":"hq","走者移動理由":"move","B":"B","S":"S","O":"O","R1":"r1","R2":"r2","R3":"r3","先攻点":"stop","後攻点":"sbot"};
const REC_MAP_N = {}; Object.entries(REC_MAP).forEach(([k, v]) => REC_MAP_N[norm(k)] = v);
const ROSTER_MAP = {"チーム":"team","選手名":"player","利き腕/打席":"hand","ポジション":"pos","区分":"kind"};
const ROSTER_MAP_N = {}; Object.entries(ROSTER_MAP).forEach(([k, v]) => ROSTER_MAP_N[norm(k)] = v);
function isRecorderHeader(h){ const s = new Set(h.map(norm)); return ["先攻","後攻","表裏","打者","投手","結果","b","s","o"].every(k => s.has(norm(k))); }

function recRows(aoa){
  // 複数の試合ファイルを1枚に貼り合わせたシートでは、途中に見出し行が入り、列の並びが変わることがある

  const rows = aoa.filter(r => Array.isArray(r) && r.some(v => !blank(v)));

    const header = rows[i].map(v => blank(v) ? "" : String(v).trim());
    if(isRecorderHeader(header)){
      map = header.map(h => REC_MAP_N[norm(h)] || null); sections++; layouts.add(header.length + ":" + map.indexOf("B"));
      continue;
    }
    if(!map){ if(i >= 10) return null; continue; }
    const o = {}; map.forEach((c, j) => { if(c && !(c in o)) o[c] = rows[i][j]; }); o._row = i; out.push(o);
  }

}
function rosterRows(aoa){
  const rows = aoa.filter(r => Array.isArray(r) && r.some(v => !blank(v)));
  for(let i = 0; i < Math.min(10, rows.length); i++){
    const header = rows[i].map(v => blank(v) ? "" : String(v).trim());
    if(isRosterHeader(header)){
      const map = header.map(h => ROSTER_MAP_N[norm(h)] || null);
      return rows.slice(i + 1).map(r => { const o = {}; map.forEach((c, j) => { if(c) o[c] = str(r[j], ""); }); return o; }).filter(o => o.player);
    }
  }

}
const nn = v => { const n = num(v); return isNaN(n) ? null : n; };
const RUNLBL = f => { const occ = ["一","二","三"].filter((_, i) => f[i]); return !occ.length ? "なし" : occ.length === 3 ? "満塁" : occ.join("") + "塁"; };

function convertRecorder(list){

  // 試合は「日付・先攻・後攻」でまとめる。記録の途中で試合番号だけが変わった数行（G001の途中にG002〜G005が1球ずつ等）は、
  // 同じ試合として扱う。同じ日・同じ対戦で、どちらの試合番号にも30球以上あるときだけ別の試合（ダブルヘッダー）とみなす。

  list.forEach(({src, objs}) => {
    const g = new Map();
    objs.forEach(o => {
      if(blank(o.batter) && blank(o.pitcher) && blank(o.result)) return;
      const k = [parseDate(o.date), str(o.top, ""), str(o.bot, "")].join("|");
      if(!g.has(k)) g.set(k, []); g.get(k).push(o);
    });
    g.forEach((rs, k) => {
      const cnt = new Map(); rs.forEach(o => { const n = str(o.gno, ""); cnt.set(n, (cnt.get(n) || 0) + 1); });
      const big = [...cnt].filter(([, c]) => c >= 30).map(([n]) => n);
      const main = [...cnt].sort((a, b) => b[1] - a[1])[0][0];
      const parts = new Map();
      if(big.length <= 1){
        parts.set(main, rs);
        const stray = [...cnt].filter(([n]) => n !== main);
        if(stray.length) warnings.push(`${k.split("|")[0]} ${k.split("|")[1]}対${k.split("|")[2]}：試合番号が途中で ${stray.map(([n, c]) => `${n || "空欄"}（${c}球）`).join("・")} に変わっている行を、${main}の試合としてまとめました。`);

      }

        const gk = k + "|" + n, cur = byGame.get(gk);

    const [d, top, bot, n] = key.split("|");
    convGame(rs.map(o => Object.assign({}, o, {gno: n})), [d, n, top, bot].join("|"), out);
  });
  return out;
}

  const obs = cvals.length ? cvals[Math.min(cvals.length - 1, Math.floor(cvals.length * .01))] : 0;

    else {
      let o = 0;
      if(r.result === "併殺打") o = 2;
      else if(ev.pa && ["OUT","SO","SF","SH"].includes(ev.pa) && !["失策","野選"].includes(r.result)) o = 1;

  if(partial) out.warnings.push(`${gname}：${missingHalves.length > 6 ? missingHalves.slice(0, 6).join("・") + " ほか" : missingHalves.join("・")}の記録がありません。一部だけの記録なので、試合結果（勝敗）には入れず、打撃・投手成績だけに使っています。`);

  const pline = (team, opp, name) => { const k = team + "|" + name; if(!PB.has(k)){ const o = Object.assign({team, opponent: opp, player: name}, meta); PIT.forEach(c => o[c] = 0); PB.set(k, o); porder[team].push(name); } return PB.get(k); };

function classifyRec(r){
  const res = r.result;
  if(!res || NONPITCH_RES.has(res) || res.startsWith("牽制") || (res.startsWith("（") || res.startsWith("("))){
    if(res === "ピッチクロック" && r.B === 3) return {pitch: false, cat: null, pa: "BB", label: "四球"};
    return {pitch: false, cat: null, pa: null};
  }
  if(res === "ボール" && r.B === 3) return {pitch: true, cat: "ボール", pa: "BB", label: "四球"};
  if(STRIKE_LIKE.has(res) && r.S === 2) return {pitch: true, cat: PC_MAP[res], pa: "SO", label: res === "空振り" ? "空振り三振" : "見逃し三振"};
  if(PC_MAP[res] && !PA_MAP[res]) return {pitch: true, cat: PC_MAP[res], pa: null};
  const pa = PA_MAP[res];
  if(pa) return {pitch: res !== "故意四球" && pa !== "OTHER", cat: PC_MAP[res] || (INPLAY.has(pa) ? "インプレー" : null), pa, label: res};

  const saved = await IDB.get("sources"); if(Array.isArray(saved)) SOURCES = saved;
  SAVED = saved !== undefined ? true : null;
  rebuild(false);
})();
</script>
